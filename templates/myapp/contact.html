{% extends 'base.html' %}

{% block title %}Contact Us{% endblock %}

{% block content %}

<style>
    .contact-section {
        max-width: 700px;
        margin: 60px auto;
        padding: 40px;
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .contact-section h1 {
        text-align: center;
        margin-bottom: 10px;
        color: #111827;
        font-size: 2rem;
    }

    .contact-section p {
        text-align: center;
        color: #6b7280;
        margin-bottom: 30px;
    }

    .contact-form {
        display: flex;
        flex-direction: column;
        gap: 18px;
    }

    .contact-form label {
        font-weight: 600;
        color: #111827;
    }

    .contact-form input,
    .contact-form textarea {
        width: 100%;
        padding: 14px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 15px;
        transition: 0.3s ease;
        box-sizing: border-box;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 10px rgba(37,99,235,0.2);
    }

    .contact-form button {
        padding: 15px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #2563eb, #1e40af);
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s ease;
    }

    .contact-form button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(37,99,235,0.3);
    }

    .success-message {
        background: #dcfce7;
        color: #166534;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        text-align: center;
        font-weight: 600;
    }

    @media (max-width: 768px) {
        .contact-section {
            margin: 20px;
            padding: 25px;
        }

        .contact-section h1 {
            font-size: 1.7rem;
        }
    }
</style>

<section class="contact-section">

    <h1>Contact BB Fitness Crew</h1>
    <p>Ready to start your fitness journey? Send us a message.</p>

    {% if success %}
    <div class="success-message">
        {{ success }}
    </div>
    {% endif %}

    <form method="POST" action="{% url 'contact' %}" class="contact-form">
        {% csrf_token %}

        <div>
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required>
        </div>

        <div>
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required>
        </div>

        <div>
            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required>
        </div>

        <div>
            <label for="message">Message</label>
            <textarea
                id="message"
                name="message"
                rows="5"
                placeholder="Tell us about your fitness goals..."
                required></textarea>
        </div>

        <button type="submit">
            Send Message
        </button>

    </form>

</section>

{% endblock %}
